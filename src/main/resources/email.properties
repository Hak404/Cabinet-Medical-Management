# Configuration SMTP (externalisée — ne pas committer de mots de passe réels)
# Copiez vers email.local.properties (ignoré par git) ou utilisez les variables d'environnement.

# Valeur par défaut si email.local.properties est absent.
# Pour activer l'envoi : copiez email.properties.example vers email.local.properties
# avec email.enabled=true et vos identifiants Gmail, puis redémarrez Tomcat.
email.enabled=false

# Journaliser le code OTP si l'envoi échoue (développement uniquement)
email.log.otp.on.failure=true

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# Laisser vide ici ; définir via email.local.properties ou EMAIL_SMTP_USER / EMAIL_SMTP_PASSWORD
mail.smtp.user=
mail.smtp.password=

mail.from=
mail.from.name=Cabinet Medical
